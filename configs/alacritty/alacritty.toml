# ──────────────────────────────────────────────────────────────────────────────
#  Alacritty Configuration — Dolphin Teal / VerdArch Theme
#  Matches KDE Konsole VerdArch Profile (Arch Linux + KDE Plasma)
# ──────────────────────────────────────────────────────────────────────────────

[window]
opacity = 0.85
blur = true
dimensions = { columns = 129, lines = 33 }
padding = { x = 14, y = 12 }
dynamic_padding = true
decorations = "full"
startup_mode = "Windowed"

[font]
size = 10.0

[font.normal]
family = "MesloLGS Nerd Font"
style = "Regular"

[font.bold]
family = "MesloLGS Nerd Font"
style = "Bold"

[font.italic]
family = "MesloLGS Nerd Font"
style = "Italic"

[font.bold_italic]
family = "MesloLGS Nerd Font"
style = "Bold Italic"

[cursor]
style = { shape = "Beam", blinking = "On" }
blink_interval = 500

[scrolling]
history = 10000
multiplier = 3

# ══════════════════════════════════════════════════════════════════════════════
#  COLOR SCHEME: VerdArch (1:1 Match with KDE Konsole)
# ══════════════════════════════════════════════════════════════════════════════

[colors.primary]
background = "#30313a"
foreground = "#fcfcfc"

[colors.cursor]
text = "#30313a"
cursor = "#1abc9c"

[colors.selection]
text = "#30313a"
background = "#1abc9c"

[colors.normal]
black   = "#232627"
red     = "#ed1515"
green   = "#11d116"
yellow  = "#f67400"
blue    = "#1d99f3"
magenta = "#9b59b6"
cyan    = "#1abc9c"
white   = "#fcfcfc"

[colors.bright]
black   = "#7f8c8d"
red     = "#c0392b"
green   = "#1cdc9a"
yellow  = "#fdbc4b"
blue    = "#3daee9"
magenta = "#8e44ad"
cyan    = "#16a085"
white   = "#ffffff"
